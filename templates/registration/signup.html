{% extends "base.html" %}

{% block content %}
<section class="page-section">
    <h1 class="page-title">Sign Up</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>

    <p style="margin-top: 1rem;">
        Already have an account?
        <a href="{% url 'login' %}">Log in here</a>
    </p>
</section>
{% endblock %}
